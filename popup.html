<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slangmaxxer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>SLANGMAXXER</h1>
    <p class="subtitle">looksmaxxing text converter</p>

    <div class="toggle-section">
      <label class="toggle">
        <input type="checkbox" id="enableToggle">
        <span class="slider"></span>
      </label>
      <span id="statusText" class="status-text">OFF</span>
    </div>

    <div class="intensity-section">
      <label for="intensity">PSL Intensity</label>
      <input type="range" id="intensity" min="1" max="3" value="2" step="1">
      <div class="intensity-labels">
        <span>Softmaxx</span>
        <span>Hardmaxx</span>
        <span>GIGAMOG</span>
      </div>
    </div>

    <button id="convertBtn" class="convert-btn">MOG THIS PAGE</button>
    <button id="revertBtn" class="revert-btn">UNDO (COPE)</button>

    <p class="footer">your PSL rating after using this: immeasurable</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
